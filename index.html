<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ChatRush</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg,#141e30,#243b55);
  transition: 0.4s;
  color: white;
}

.light {
  background: linear-gradient(135deg,#e3e3e3,#ffffff);
  color: black;
}

#chat {
  width: 380px;
  max-width: 95%;
  height: 600px;
  backdrop-filter: blur(20px);
  background: rgba(0,0,0,0.6);
  border-radius: 25px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  transition: 0.4s;
}

.light #chat {
  background: rgba(255,255,255,0.8);
}

.logo {
  text-align:center;
  font-size:26px;
  font-weight:600;
  margin-bottom:5px;
}

#online {
  font-size:13px;
  margin-bottom:8px;
}

#messages {
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:10px;
  border-radius:15px;
  background: rgba(0,0,0,0.4);
}

.message {
  max-width:75%;
  padding:10px 14px;
  border-radius:20px;
  font-size:14px;
  display:flex;
  flex-direction:column;
  animation: fade 0.3s ease;
}

@keyframes fade {
  from {opacity:0; transform:translateY(5px);}
  to {opacity:1; transform:translateY(0);}
}

.you {
  align-self:flex-end;
  background: linear-gradient(45deg,#ff416c,#ff4b2b);
}

.stranger {
  align-self:flex-start;
  background:#2e2e2e;
}

.time {
  font-size:10px;
  opacity:0.6;
  margin-top:4px;
  align-self:flex-end;
}

#typing {
  font-size:12px;
  height:18px;
  opacity:0.8;
}

input {
  padding:10px;
  border-radius:15px;
  border:none;
  margin-top:5px;
  outline:none;
}

button {
  padding:10px;
  border-radius:15px;
  border:none;
  margin-top:6px;
  cursor:pointer;
  font-weight:600;
  position:relative;
  overflow:hidden;
}

#nextBtn {
  background: linear-gradient(45deg,#ff416c,#ff4b2b);
  color:white;
}

#reportBtn {
  background:#444;
  color:white;
}

#toggleTheme {
  background:#777;
  color:white;
  font-size:12px;
}

button::after {
  content:"";
  position:absolute;
  width:0;
  height:0;
  background:rgba(255,255,255,0.3);
  border-radius:50%;
  transform:scale(1);
  opacity:0;
  pointer-events:none;
}

button:active::after {
  width:200px;
  height:200px;
  opacity:1;
  transition:0s;
}
</style>
</head>

<body>

<div id="chat">
  <div class="logo">ChatRush</div>
  <div id="online">Online: 0</div>
  <div id="messages"></div>
  <div id="typing"></div>
  <input id="msgInput" placeholder="Type message..." />
  <button id="nextBtn">Next</button>
  <button id="reportBtn">Report</button>
  <button id="toggleTheme">Toggle Theme</button>
</div>

<audio id="matchSound" src="match.mp3"></audio>
<audio id="messageSound" src="message.mp3"></audio>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const messages = document.getElementById("messages");
const input = document.getElementById("msgInput");
const typingDiv = document.getElementById("typing");
const matchSound = document.getElementById("matchSound");
const messageSound = document.getElementById("messageSound");

function addMessage(text, type){
  const msg = document.createElement("div");
  msg.classList.add("message", type);
  msg.innerHTML = text;

  const time = document.createElement("div");
  time.classList.add("time");
  const now = new Date();
  time.innerText = now.getHours() + ":" + now.getMinutes().toString().padStart(2,'0');

  msg.appendChild(time);
  messages.appendChild(msg);

  messages.scrollTo({
    top: messages.scrollHeight,
    behavior: "smooth"
  });
}

socket.on("onlineCount", count=>{
  document.getElementById("online").innerText="Online: "+count;
});

socket.on("matched", ()=>{
  addMessage("✅ Connected to stranger","system");
  matchSound.play();
});

socket.on("chatMessage", msg=>{
  addMessage(msg,"stranger");
  messageSound.play();
});

socket.on("typing", ()=>{
  typingDiv.innerText="Stranger is typing...";
});

socket.on("stopTyping", ()=>{
  typingDiv.innerText="";
});

socket.on("system", msg=>{
  addMessage(msg,"system");
});

input.addEventListener("input", ()=>{
  socket.emit("typing");
  setTimeout(()=>socket.emit("stopTyping"),1000);
});

input.addEventListener("keypress", e=>{
  if(e.key==="Enter"){
    if(input.value.trim()!==""){
      addMessage(input.value,"you");
      socket.emit("chatMessage",input.value);
      input.value="";
    }
  }
});

document.getElementById("nextBtn").onclick=()=>{
  messages.innerHTML="";
  addMessage("🔍 Searching for someone...","system");
  socket.emit("next");
};

document.getElementById("reportBtn").onclick=()=>{
  socket.emit("report");
};

document.getElementById("toggleTheme").onclick=()=>{
  document.body.classList.toggle("light");
};
</script>

</body>
</html>
