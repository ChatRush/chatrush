<!DOCTYPE html>
<html>
<head>
  <title>ChatRush</title>
  <meta charset="UTF-8" />
  <style>
    body { font-family: Arial; max-width: 750px; margin: 20px auto; }
    #status { padding: 10px; border: 1px solid #ddd; margin: 10px 0; }
    #chatBox { height: 380px; border: 1px solid #ccc; overflow-y: auto; padding: 10px; }
    .me { text-align: right; }
    .bubble { display: inline-block; padding: 8px 10px; border-radius: 10px; margin: 5px 0; border: 1px solid #ddd; }
    #controls { display: flex; gap: 10px; margin-top: 10px; }
    #msg { flex: 1; padding: 10px; }
    button { padding: 10px 14px; cursor: pointer; }
  </style>
</head>
<body>

<h2>ChatRush 🔥 Random Chat</h2>

<div id="status">Status: Not started</div>

<div id="chatBox"></div>

<div id="controls">
  <input id="msg" placeholder="Type message..." disabled />
  <button id="sendBtn" disabled>Send</button>
  <button id="nextBtn" disabled>Next</button>
</div>

<button id="startBtn">Start</button>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  const statusEl = document.getElementById("status");
  const chatBox = document.getElementById("chatBox");
  const msgInput = document.getElementById("msg");
  const sendBtn = document.getElementById("sendBtn");
  const nextBtn = document.getElementById("nextBtn");
  const startBtn = document.getElementById("startBtn");

  function addMsg(text, who="other") {
    const div = document.createElement("div");
    if (who === "me") div.className = "me";
    div.innerHTML = `<span class="bubble"></span>`;
    div.querySelector(".bubble").textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function setConnectedUI(connected) {
    msgInput.disabled = !connected;
    sendBtn.disabled = !connected;
    nextBtn.disabled = !connected;
  }

  startBtn.onclick = () => {
    statusEl.textContent = "Status: Searching...";
    socket.emit("find_partner");
  };

  sendBtn.onclick = () => {
    const text = msgInput.value.trim();
    if (!text) return;
    addMsg(text, "me");
    socket.emit("chat_message", text);
    msgInput.value = "";
  };

  msgInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendBtn.click();
  });

  nextBtn.onclick = () => {
    socket.emit("next");
    setConnectedUI(false);
  };

  socket.on("waiting", () => {
    statusEl.textContent = "Status: Waiting for partner...";
    setConnectedUI(false);
  });

  socket.on("matched", () => {
    statusEl.textContent = "Status: Connected ✅";
    setConnectedUI(true);
    addMsg("Connected! Say hi 👋");
  });

  socket.on("chat_message", (msg) => addMsg(msg, "other"));

  socket.on("partner_left", () => {
    addMsg("Partner left. Click Start or Next.");
    statusEl.textContent = "Status: Disconnected";
    setConnectedUI(false);
  });

  socket.on("clear_chat", () => {
    chatBox.innerHTML = "";
  });

  socket.on("status", (t) => {
    statusEl.textContent = "Status: " + t;
  });

  socket.on("re_find", () => {
    socket.emit("find_partner");
  });
</script>

</body>
</html>
