<!DOCTYPE html>
<html>
<head>
  <title>ChatRush . Random Chat</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #141e30);
  background-size: 400% 400%;
  animation: gradientMove 15s ease infinite;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

#chat {
  width: 380px;
  max-width: 95%;
  backdrop-filter: blur(20px);
  background: rgba(20, 20, 20, 0.65);
  border-radius: 25px;
  padding: 25px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
  transition: 0.3s ease;
}

#chat:hover {
  transform: translateY(-5px);
}

.logo {
  text-align: center;
  font-size: 28px;
  font-weight: 600;
  letter-spacing: 2px;
  background: linear-gradient(90deg, #ff3c6d, #ff8c42);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  background: rgba(0,0,0,0.5);
  border-radius: 15px;
  margin: 12px 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scrollbar-width: none;
}

#messages::-webkit-scrollbar {
  display: none;
}

.message {
  padding: 10px 14px;
  border-radius: 20px;
  max-width: 75%;
  font-size: 14px;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

.you {
  background: linear-gradient(45deg, #ff3c6d, #ff8c42);
  align-self: flex-end;
  box-shadow: 0 5px 15px rgba(255,60,109,0.4);
}

.stranger {
  background: #2b2b2b;
  align-self: flex-start;
}

.system {
  text-align: center;
  font-size: 12px;
  color: #aaa;
}

input {
  padding: 12px;
  border-radius: 15px;
  border: none;
  outline: none;
  margin-bottom: 10px;
  font-size: 14px;
  background: #1f1f1f;
  color: white;
}

button {
  padding: 12px;
  border-radius: 15px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  transition: 0.3s ease;
  font-size: 14px;
}

#nextBtn {
  background: linear-gradient(45deg, #ff3c6d, #ff8c42);
  color: white;
  margin-bottom: 8px;
  box-shadow: 0 5px 20px rgba(255,60,109,0.4);
}

#nextBtn:hover {
  transform: scale(1.05);
}

#reportBtn {
  background: #2a2a2a;
  color: #bbb;
}

#reportBtn:hover {
  background: #444;
  color: white;
}

#online {
  font-size: 13px;
  margin-top: 5px;
}

#typing {
  font-size: 12px;
  color: #ccc;
  height: 18px;
}

@media (max-width: 500px) {
  #chat {
    height: 95vh;
  }
}
  </style>
</head>

<body>

<div id="chat">
  <h3 class="logo">ChatRush</h3>

  <p style="text-align:center; opacity:0.7; font-size:13px;">
    Talk to strangers instantly 🌍
  </p>

  <div id="online" style="color:lightgreen; margin-bottom:5px;">
    🟢 Online users: 0
  </div>

  <div id="typing" style="color:gray; font-size:12px;"></div>

  <div id="messages"></div>

  <input id="msg" placeholder="Type message..." />
  <button id="nextBtn">Next ⏭</button>
  <button id="reportBtn">🚫 Report</button>
</div>

<!-- LOADING SCREEN -->
<div id="loadingScreen">
  <div class="loader"></div>
  <p>Connecting to stranger...</p>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
let username = prompt("Enter your username:");
if (!username || username.trim() === "") {
  username = "Anonymous";
}

const socket = io();
const messages = document.getElementById("messages");
const input = document.getElementById("msg");
const nextBtn = document.getElementById("nextBtn");
const reportBtn = document.getElementById("reportBtn");
const online = document.getElementById("online");
const typing = document.getElementById("typing");

reportBtn.addEventListener("click", () => {
  socket.emit("report");
  messages.innerHTML += "<div class='system'>🚫 You reported this user</div>";
});

socket.on("matched", () => {
  document.getElementById("loadingScreen").style.display = "none";
  messages.innerHTML += "<div class='system'>✅ Connected to stranger</div>";
});

socket.on("onlineCount", (count) => {
  online.innerHTML = "🟢 Online users: " + count;
});

socket.on("chatMessage", (data) => {
  messages.innerHTML += `<div class="message stranger">${data}</div>`;
  messages.scrollTop = messages.scrollHeight;
});

socket.on("system", (msg) => {
  messages.innerHTML += `<div class="system">${msg}</div>`;
});

socket.on("typing", () => {
  typing.innerText = "✍️ Stranger is typing...";
});

socket.on("stopTyping", () => {
  typing.innerText = "";
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && input.value) {
    socket.emit("chatMessage", input.value);
    messages.innerHTML += `<div class="message you">${input.value}</div>`;
    input.value = "";
  }
});

let typingTimeout;

input.addEventListener("input", () => {
  socket.emit("typing");

  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => {
    socket.emit("stopTyping");
  }, 1000);
});

nextBtn.addEventListener("click", () => {
  messages.innerHTML = "";
  document.getElementById("loadingScreen").style.display = "flex";
  socket.emit("next");
});
</script>

</body>
</html>
