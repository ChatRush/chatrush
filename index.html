<!DOCTYPE html>
<html>
<head>
  <title>ChatRush . Random Chat</title>

  <style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #141e30, #243b55);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

#chat {
  width: 360px;
  max-width: 95%;
  background: #1c1c1c;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
}

.logo {
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 2px;
  color: #ff3c6d;
  margin-bottom: 5px;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  background: #111;
  border-radius: 12px;
  margin-bottom: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.message {
  padding: 8px 12px;
  border-radius: 15px;
  max-width: 75%;
  word-wrap: break-word;
  font-size: 14px;
}

.you {
  background: #ff3c6d;
  align-self: flex-end;
}

.stranger {
  background: #333;
  align-self: flex-start;
}

.system {
  text-align: center;
  font-size: 12px;
  color: gray;
}

input {
  padding: 10px;
  border-radius: 10px;
  border: none;
  outline: none;
  margin-bottom: 8px;
}

button {
  padding: 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  transition: 0.2s;
}

#nextBtn {
  background: #ff3c6d;
  color: white;
  margin-bottom: 5px;
}

#nextBtn:hover {
  background: #ff1f5a;
}

#reportBtn {
  background: #444;
  color: white;
}

#reportBtn:hover {
  background: #666;
}

/* ✅ LOADING SCREEN CSS (MOVED INSIDE STYLE TAG) */

#loadingScreen {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: #141e30;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
  z-index: 9999;
}

.loader {
  border: 6px solid #333;
  border-top: 6px solid #ff3c6d;
  border-radius: 50%;
  width: 60px;
  height: 60px;
  animation: spin 1s linear infinite;
  margin-bottom: 20px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@media (max-width: 500px) {
  #chat {
    height: 95vh;
  }
}
  </style>
</head>

<body>

<div id="chat">
  <h3 class="logo">ChatRush</h3>

  <p style="text-align:center; color:gray; font-size:12px;">
    Talk to strangers instantly 🌍
  </p>

  <div id="online" style="color:lightgreen; margin-bottom:5px;">
    🟢 Online users: 0
  </div>

  <div id="typing" style="color:gray; font-size:12px;"></div>

  <div id="messages"></div>

  <input id="msg" placeholder="Type message..." />
  <button id="nextBtn">Next ⏭</button>
  <button id="reportBtn">🚫 Report</button>
</div>

<!-- LOADING SCREEN -->
<div id="loadingScreen">
  <div class="loader"></div>
  <p>Connecting to stranger...</p>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
let username = prompt("Enter your username:");
if (!username || username.trim() === "") {
  username = "Anonymous";
}

const socket = io();
const messages = document.getElementById("messages");
const input = document.getElementById("msg");
const nextBtn = document.getElementById("nextBtn");
const reportBtn = document.getElementById("reportBtn");
const online = document.getElementById("online");
const typing = document.getElementById("typing");

reportBtn.addEventListener("click", () => {
  socket.emit("report");
  messages.innerHTML += "<div class='system'>🚫 You reported this user</div>";
});

socket.on("matched", () => {
  document.getElementById("loadingScreen").style.display = "none";
  messages.innerHTML += "<div class='system'>✅ Connected to stranger</div>";
});

socket.on("onlineCount", (count) => {
  online.innerHTML = "🟢 Online users: " + count;
});

socket.on("chatMessage", (data) => {
  messages.innerHTML += `<div class="message stranger">${data}</div>`;
  messages.scrollTop = messages.scrollHeight;
});

socket.on("system", (msg) => {
  messages.innerHTML += `<div class="system">${msg}</div>`;
});

socket.on("typing", () => {
  typing.innerText = "✍️ Stranger is typing...";
});

socket.on("stopTyping", () => {
  typing.innerText = "";
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && input.value) {
    socket.emit("chatMessage", input.value);
    messages.innerHTML += `<div class="message you">${input.value}</div>`;
    input.value = "";
  }
});

let typingTimeout;

input.addEventListener("input", () => {
  socket.emit("typing");

  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => {
    socket.emit("stopTyping");
  }, 1000);
});

nextBtn.addEventListener("click", () => {
  messages.innerHTML = "";
  document.getElementById("loadingScreen").style.display = "flex";
  socket.emit("next");
});
</script>

</body>
</html>
